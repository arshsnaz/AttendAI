<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background / Glow Gradients -->
    <linearGradient id="logoBgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2E45" />
      <stop offset="100%" stop-color="#144A6B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Corner Biometric Target Brackets -->
  <!-- Top Left -->
  <path d="M 22 36 L 22 24 A 2 2 0 0 1 24 22 L 36 22" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top Right -->
  <path d="M 84 22 L 96 22 A 2 2 0 0 1 98 24 L 98 36" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Right -->
  <path d="M 98 84 L 98 96 A 2 2 0 0 1 96 98 L 84 98" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Head & Shoulders Silhouette -->
  <path d="M 60 22 C 45 22 35 34 35 50 C 35 60 40 70 47 78 C 45 84 37 92 26 98 C 40 102 80 102 94 98 C 83 92 75 84 73 78 C 80 70 85 60 85 50 C 85 34 75 22 60 22 Z" fill="url(#logoBgGrad)" />

  <!-- Face Biometric Polygonal Wireframe Mesh -->
  <g stroke="url(#meshGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Center vertical line -->
    <line x1="60" y1="30" x2="60" y2="44" />
    <line x1="60" y1="44" x2="60" y2="58" />
    <line x1="60" y1="58" x2="60" y2="72" />

    <!-- Forehead & Brow Polygons -->
    <line x1="60" y1="30" x2="47" y2="38" />
    <line x1="60" y1="30" x2="73" y2="38" />
    <line x1="47" y1="38" x2="60" y2="44" />
    <line x1="73" y1="38" x2="60" y2="44" />

    <!-- Cheek & Temple Lines -->
    <line x1="47" y1="38" x2="40" y2="52" />
    <line x1="73" y1="38" x2="80" y2="52" />
    <line x1="40" y1="52" x2="60" y2="44" />
    <line x1="80" y1="52" x2="60" y2="44" />

    <!-- Mid Face & Nose Lines -->
    <line x1="40" y1="52" x2="48" y2="60" />
    <line x1="80" y1="52" x2="72" y2="60" />
    <line x1="48" y1="60" x2="60" y2="58" />
    <line x1="72" y1="60" x2="60" y2="58" />
    <line x1="40" y1="52" x2="60" y2="58" />
    <line x1="80" y1="52" x2="60" y2="58" />

    <!-- Jaw & Chin Lines -->
    <line x1="48" y1="60" x2="45" y2="70" />
    <line x1="72" y1="60" x2="75" y2="70" />
    <line x1="45" y1="70" x2="60" y2="72" />
    <line x1="75" y1="70" x2="60" y2="72" />
    <line x1="48" y1="60" x2="60" y2="72" />
    <line x1="72" y1="60" x2="60" y2="72" />
  </g>

  <!-- Mesh Vertex Dots / Nodes -->
  <g fill="#FFFFFF" stroke="#0B2E45" stroke-width="1.2">
    <!-- Forehead Center -->
    <circle cx="60" cy="30" r="2.8" />
    <!-- Brows -->
    <circle cx="47" cy="38" r="2.4" />
    <circle cx="73" cy="38" r="2.4" />
    <!-- Eye Bridge Center -->
    <circle cx="60" cy="44" r="2.8" />
    <!-- Temples -->
    <circle cx="40" cy="52" r="2.4" />
    <circle cx="80" cy="52" r="2.4" />
    <!-- Nose Tip -->
    <circle cx="60" cy="58" r="2.8" />
    <!-- Cheeks -->
    <circle cx="48" cy="60" r="2.4" />
    <circle cx="72" cy="60" r="2.4" />
    <!-- Jaw Outer -->
    <circle cx="45" cy="70" r="2.2" />
    <circle cx="75" cy="70" r="2.2" />
    <!-- Chin -->
    <circle cx="60" cy="72" r="2.8" />
  </g>

  <!-- Verified Checkmark Badge (Bottom Left) -->
  <g filter="url(#glow)">
    <circle cx="32" cy="78" r="16" fill="url(#badgeGrad)" />
    <circle cx="32" cy="78" r="16" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M 24 78 L 29 83 L 40 72" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
