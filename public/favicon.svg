<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#082338" />
      <stop offset="100%" stop-color="#0F4363" />
    </linearGradient>
    <linearGradient id="cyanStroke" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="meshStroke" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- High-Contrast Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- 4 Corner Target Brackets (Bold for 16px tab visibility) -->
  <path d="M 7 18 L 7 9 A 2 2 0 0 1 9 7 L 18 7" stroke="url(#cyanStroke)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 46 7 L 55 7 A 2 2 0 0 1 57 9 L 57 18" stroke="url(#cyanStroke)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 7 46 L 7 55 A 2 2 0 0 0 9 57 L 18 57" stroke="url(#cyanStroke)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 57 46 L 57 55 A 2 2 0 0 1 55 57 L 46 57" stroke="url(#cyanStroke)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Head & Shoulder Contour -->
  <path d="M 32 12 C 23.5 12 18 19 18 28.5 C 18 34.5 21 40.5 25 45 C 23.5 48.5 19 53 12 56 C 20 58.5 44 58.5 52 56 C 45 53 40.5 48.5 39 45 C 43 40.5 46 34.5 46 28.5 C 46 19 40.5 12 32 12 Z" fill="#051826" />

  <!-- Central Facial AI Biometric Mesh Grid -->
  <g stroke="url(#meshStroke)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical center -->
    <line x1="32" y1="16" x2="32" y2="25" />
    <line x1="32" y1="25" x2="32" y2="34" />
    <line x1="32" y1="34" x2="32" y2="42" />

    <!-- Forehead Polygons -->
    <line x1="32" y1="16" x2="24" y2="21" />
    <line x1="32" y1="16" x2="40" y2="21" />
    <line x1="24" y1="21" x2="32" y2="25" />
    <line x1="40" y1="21" x2="32" y2="25" />

    <!-- Temples to Midface -->
    <line x1="24" y1="21" x2="20" y2="29" />
    <line x1="40" y1="21" x2="44" y2="29" />
    <line x1="20" y1="29" x2="32" y2="25" />
    <line x1="44" y1="29" x2="32" y2="25" />

    <!-- Cheeks to Nose -->
    <line x1="20" y1="29" x2="25" y2="35" />
    <line x1="44" y1="29" x2="39" y2="35" />
    <line x1="25" y1="35" x2="32" y2="34" />
    <line x1="39" y1="35" x2="32" y2="34" />

    <!-- Jaw to Chin -->
    <line x1="25" y1="35" x2="32" y2="42" />
    <line x1="39" y1="35" x2="32" y2="42" />
  </g>

  <!-- High-Visibility Vertex Dots -->
  <g fill="#FFFFFF">
    <circle cx="32" cy="16" r="2.2" />
    <circle cx="24" cy="21" r="1.8" />
    <circle cx="40" cy="21" r="1.8" />
    <circle cx="32" cy="25" r="2.2" />
    <circle cx="20" cy="29" r="1.8" />
    <circle cx="44" cy="29" r="1.8" />
    <circle cx="32" cy="34" r="2.2" />
    <circle cx="25" cy="35" r="1.8" />
    <circle cx="39" cy="35" r="1.8" />
    <circle cx="32" cy="42" r="2.2" />
  </g>

  <!-- Verified Glowing Checkmark Pill Badge -->
  <g>
    <circle cx="48" cy="48" r="10.5" fill="#10B981" stroke="#082338" stroke-width="2.5" />
    <path d="M 43.5 48 L 46.5 51 L 52.5 44.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
